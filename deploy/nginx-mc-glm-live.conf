# MineCraft-GLM · Nginx 站点配置(独立 server 块,不影响现有 default)
# 路径:/etc/nginx/sites-available/mc-glm.conf  →  sites-enabled/mc-glm.conf (软链)
#
# 设计:
#  - 服务器原有 default_server(server_name _,root /var/www/html)继续兜底服务其他 Host。
#  - 本块 server_name 49.233.157.164,对 IP 访问生效;location / 仍指向 /var/www/html,
#    保留现有测试首页不变,仅在 /mc-glm/ 下反代到应用容器。
#  - WebSocket 经 $mc_glm_connection_upgrade map 正确透传 Upgrade/Connection。
#  - limit_req_zone:在 http{} 块级定义限流区,防爆破与滥用(2026-06-26 加固)。

# ---- 限流区(按客户端 IP)----
# 登录接口:严格限流,每秒 1 次,突发 5 次(配合应用层 5 次失败锁定)
limit_req_zone $binary_remote_addr zone=mc_login:10m rate=1r/s;
# 通用 API:每秒 10 次,突发 20 次
limit_req_zone $binary_remote_addr zone=mc_api:10m rate=10r/s;
# WebSocket 连接建立:每秒 5 次,突发 10 次(防连接洪水)
limit_req_zone $binary_remote_addr zone=mc_ws:10m rate=5r/s;

map $http_upgrade $mc_glm_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # 命中公网IP / 本机回环,保证服务器自测与浏览器访问一致
    server_name 49.233.157.164 localhost 127.0.0.1;

    # 保留现有静态首页(/var/www/html 的测试页仍可在 / 访问)
    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    access_log /var/log/nginx/mc-glm.access.log;
    error_log  /var/log/nginx/mc-glm.error.log;

    client_max_body_size 2m;

    # ---- 登录接口:严格限流(防暴力破解)----
    location ~ ^/mc-glm/api/login$ {
        limit_req zone=mc_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- WebSocket:限流连接建立频率 + 透传升级头 ----
    location = /mc-glm/ws {
        limit_req zone=mc_ws burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级头(ws 库握手必需)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $mc_glm_connection_upgrade;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # ---- 应用:子路径 /mc-glm/ 透传到容器 127.0.0.1:3000 ----
    location /mc-glm/ {
        limit_req zone=mc_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级头(ws 库握手必需)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $mc_glm_connection_upgrade;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # /mc-glm → /mc-glm/(带尾斜杠,保证相对路径正确)
    location = /mc-glm {
        return 301 /mc-glm/;
    }

    # 斗罗大陆的易记入口；转发时去掉 /douluo/ 前缀。
    location = /douluo {
        return 301 /douluo/;
    }

    location /douluo/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 其余路径:沿用原有静态文件行为(不影响测试首页)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
