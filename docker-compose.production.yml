services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: douluo-game:latest
    container_name: douluo-game-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      - douluo-data:/app/data
    mem_limit: 768m
    mem_reservation: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  douluo-data:
    name: douluo-data

