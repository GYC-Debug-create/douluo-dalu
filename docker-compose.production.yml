services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: douluo-game:latest
    container_name: douluo-game-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # 内测期关闭注册，账号用 scripts/account-admin.js 创建；改成 "1" 才开放注册
      ALLOW_REGISTER: "0"
    volumes:
      - douluo-data:/app/data
    mem_limit: 768m
    mem_reservation: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  douluo-data:
    name: douluo-data

